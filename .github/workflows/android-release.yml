name: Android release

# Publishes a signed APK in GitHub Releases when a tag like android-v1.2.0 is pushed.
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag must look like android-v1.2.3"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish an APK signed with the public test key"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "opdshelf-$APP_VERSION_NAME.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "opdshelf-$APP_VERSION_NAME.apk" \
            --title "OPDShelf for Android $APP_VERSION_NAME" --generate-notes
