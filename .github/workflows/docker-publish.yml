name: Build and Push Docker image

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# A newer push to the same branch replaces the build in progress
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: koalilla/opds-server

jobs:
  # Each architecture builds on a runner of its own kind: arm64 under QEMU
  # took about six times as long as amd64
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main publishes :latest and beta publishes :beta, each pointing its
      # panel at the releases of the same channel
      - name: Pick the channel
        id: channel
        run: echo "name=${{ github.ref_name == 'beta' && 'beta' || 'latest' }}" >> "$GITHUB_OUTPUT"

      # Pushed by digest only; the merge job below tags both architectures
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CHANNEL=${{ steps.channel.outputs.name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Save the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag both architectures
        run: |
          tag="${{ github.ref_name == 'beta' && 'beta' || 'latest' }}"
          docker buildx imagetools create -t "$IMAGE:$tag" \
            $(for f in digests/*; do echo "$IMAGE@$(cat "$f")"; done)
          docker buildx imagetools inspect "$IMAGE:$tag"
