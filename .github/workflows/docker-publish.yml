name: Build and Push Docker image

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# One build per branch: a newer push cancels the build still running, so an
# older build that finishes last can never overwrite the image
concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main publishes :latest and beta publishes :beta, each pointing its
      # panel at the releases of the same channel
      - name: Pick the channel
        id: channel
        run: echo "name=${{ github.ref_name == 'beta' && 'beta' || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CHANNEL=${{ steps.channel.outputs.name }}
          tags: koalilla/opds-server:${{ steps.channel.outputs.name }}
