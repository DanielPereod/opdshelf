services:
  opdshelf:
    image: koalilla/opds-server:latest
    # To build from source instead: build: .
    container_name: opdshelf
    ports:
      - "3000:3000"
    volumes:
      - ./books:/app/books
    environment:
      # Leave both empty to disable authentication
      - ADMIN_USERNAME=
      - ADMIN_PASSWORD=
      # Public URL when running behind a reverse proxy, e.g. https://books.example.com
      - BASE_URL=
    restart: unless-stopped
